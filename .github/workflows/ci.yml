name: CI

# Every pull request, every push to main, and the pa2 tag. Each check is its own job, so each one
# can be marked "required" in the branch ruleset. Each job runs exactly the npm script the README
# documents — nothing else, and no step is allowed to fail quietly (no `|| true`, no continue-on-error).
on:
  pull_request:
  push:
    branches: [main]
    tags: ['pa*']

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run lint

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run format:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm test

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run test:contract

  # The sandbox minimums (class brief §5): each one has an attack submission in test/sandbox/attacks,
  # judged by the real image on the runner's Docker. The build context is docker/ only, so nothing
  # else from the repository can end up in the image.
  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run sandbox:build
      - run: npm run test:sandbox

  # The dev set must stay byte-for-byte the published one (docs/devset-integrity.md). Windows too,
  # because Git for Windows converts line endings by default. Zero dependencies, so no npm ci.
  devset:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }
      - run: node scripts/verify-devset.mjs
